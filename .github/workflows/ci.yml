name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.19.0", "24"]
    env:
      # Windows legs check out into a directory whose name contains a space (as in a typical user profile path).
      CHECKOUT_DIR: ${{ matrix.os == 'windows-latest' && 'ai factory' || '.' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ env.CHECKOUT_DIR }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: npm ci
      - name: Lint
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: npm run lint
      - name: Test
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: npm test
